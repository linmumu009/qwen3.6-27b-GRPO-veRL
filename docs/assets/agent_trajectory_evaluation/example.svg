<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1630" viewBox="0 0 1440 1630" role="img" aria-labelledby="title desc">
<title id="title">合成物流业务样例的会话式轨迹</title>
<desc id="desc">用户业务问题、模型read调用、字典返回、模型bash调用、查询返回、模型最终回答。所有内容均为合成演示，不是实际模型运行日志。</desc>
<rect x="0" y="0" width="1440" height="1630" rx="0" fill="#F2F5FA"/>
<rect x="0" y="0" width="1440" height="140" rx="0" fill="#102C43"/>
<text x="48" y="39.3" fill="#A8C6D9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" xml:space="preserve">AGENT DIALOGUE  /  业务数据分析</text>
<text x="48" y="99.4" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="36" font-weight="700" xml:space="preserve">一条业务查询的会话轨迹</text>
<rect x="1228" y="28" width="164" height="42" rx="21" fill="#254B62"/>
<text x="1256" y="57.0" fill="#D3F8ED" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" xml:space="preserve">合成演示</text>
<rect x="48" y="168" width="1344" height="160" rx="19" fill="#FFFFFF" stroke="#DAE4EE"/>
<text x="72" y="207.9" fill="#536A7A" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">用户  ·  业务问题</text>
<text x="72" y="251.8" fill="#19344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" xml:space="preserve">请查询华东区域在2026年9月已签收运单的平均派送时长。</text>
<text x="72" y="280.8" fill="#19344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" xml:space="preserve">按签收日期归属月份，只统计派送与签收时间完整且先后有效的记录，</text>
<text x="72" y="309.8" fill="#19344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" xml:space="preserve">单位为小时，保留两位小数。</text>
<rect x="48" y="348" width="1344" height="104" rx="19" fill="#EAF1FF"/>
<text x="72" y="387.9" fill="#2F65C9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">Assistant  ·  调用 read</text>
<text x="1030" y="385.4" fill="#647E92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" xml:space="preserve">id: call_read</text>
<text x="72" y="429.8" fill="#245AAA" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" xml:space="preserve">{"path": "schema_dictionary.md"}</text>
<rect x="104" y="472" width="1288" height="180" rx="19" fill="#FFFFFF" stroke="#DAE4EE"/>
<text x="128" y="511.9" fill="#587384" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">Tool  ·  read 返回</text>
<text x="1030" y="509.4" fill="#647E92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" xml:space="preserve">tool_call_id: call_read</text>
<text x="128" y="549.1" fill="#455F72" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">delivery_records（运单派送记录）</text>
<text x="128" y="575.1" fill="#455F72" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">region：区域；status：运单状态</text>
<text x="128" y="601.1" fill="#455F72" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">out_for_delivery_at：开始派送时间</text>
<text x="128" y="627.1" fill="#455F72" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">delivered_at：签收时间</text>
<rect x="48" y="674" width="1344" height="424" rx="19" fill="#EAF1FF"/>
<text x="72" y="714.9" fill="#2F65C9" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">Assistant  ·  调用 bash</text>
<text x="1030" y="712.4" fill="#647E92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" xml:space="preserve">id: call_query</text>
<text x="72" y="751.3" fill="#486F9D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" xml:space="preserve">参数 command</text>
<rect x="70" y="766" width="1300" height="309" rx="14" fill="#17334A"/>
<text x="94" y="799.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">sqlite3 -readonly -header logistics.sqlite "</text>
<text x="94" y="824.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">SELECT ROUND(AVG((julianday(delivered_at) -</text>
<text x="94" y="849.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  julianday(out_for_delivery_at)) * 24), 2)</text>
<text x="94" y="874.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AS avg_delivery_hours</text>
<text x="94" y="899.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">FROM delivery_records</text>
<text x="94" y="924.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">WHERE region = '华东' AND status = '已签收'</text>
<text x="94" y="949.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at &gt;= '2026-09-01'</text>
<text x="94" y="974.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at &lt;  '2026-10-01'</text>
<text x="94" y="999.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND out_for_delivery_at IS NOT NULL</text>
<text x="94" y="1024.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at IS NOT NULL</text>
<text x="94" y="1049.2" fill="#DCEAF4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at &gt;= out_for_delivery_at;"</text>
<rect x="104" y="1119" width="1288" height="140" rx="19" fill="#FFFFFF" stroke="#DAE4EE"/>
<text x="128" y="1157.9" fill="#587384" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">Tool  ·  bash 返回</text>
<text x="1030" y="1155.4" fill="#647E92" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" xml:space="preserve">tool_call_id: call_query</text>
<text x="128" y="1199.1" fill="#617B8E" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">avg_delivery_hours</text>
<text x="128" y="1238.8" fill="#215FC5" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="700" xml:space="preserve">4.25</text>
<rect x="48" y="1280" width="1344" height="162" rx="19" fill="#E4F5EF"/>
<text x="72" y="1318.9" fill="#166E60" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">Assistant  ·  最终回答</text>
<text x="72" y="1362.7" fill="#164E45" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" xml:space="preserve">最终结果：4.25小时。</text>
<text x="72" y="1389.0" fill="#164E45" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" xml:space="preserve">统计范围：华东区域2026年9月已签收运单；按签收月份归属。</text>
<text x="72" y="1418.0" fill="#164E45" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" xml:space="preserve">已排除时间缺失或先后无效的记录。</text>
<rect x="48" y="1464" width="1344" height="83" rx="18" fill="#FFFFFF" stroke="#DAE4EE"/>
<text x="72" y="1497.2" fill="#536D80" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" xml:space="preserve">演示核对</text>
<text x="72" y="1532.0" fill="#276D63" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" xml:space="preserve">结果判定通过  ·  所需表命中  ·  唯一终值与单位一致  ·  查询可重放</text>
<text x="48" y="1598.2" fill="#688093" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">所有消息均为合成演示；工具调用与返回逐一对应，图中结果不计入模型效果对照。</text>
</svg>
