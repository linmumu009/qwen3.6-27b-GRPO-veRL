<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">合成物流任务的 Agent 交互示例</title>
<desc id="desc">业务任务、工具环境、读取字典、只读查询、工具返回与最终回答。示例结果为4.25小时，不代表真实模型实测表现。</desc>
<rect x="0" y="0" width="1440" height="1280" rx="0" fill="#F3F6FA"/>
<rect x="0" y="0" width="1440" height="155" rx="0" fill="#102B43"/>
<text x="48" y="42.3" fill="#9DBCD1" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" xml:space="preserve">AGENT TRAJECTORY  /  业务数据分析</text>
<text x="48" y="103.30000000000001" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="700" xml:space="preserve">一次可核验的业务分析</text>
<rect x="1220" y="34" width="172" height="42" rx="21" fill="#21465E"/>
<text x="1250" y="63.0" fill="#D2F5EE" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" xml:space="preserve">合成样例</text>
<rect x="40" y="185" width="1360" height="150" rx="20" fill="#FFFFFF" stroke="#DFE7EF"/>
<rect x="64" y="208" width="91" height="30" rx="8" fill="#EAF0FF"/>
<text x="77" y="228.4" fill="#315ED0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" xml:space="preserve">业务任务</text>
<text x="64" y="279.5" fill="#18344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" xml:space="preserve">查询华东区域在2026年9月已签收运单的平均派送时长。</text>
<text x="64" y="315.0" fill="#526A7D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" xml:space="preserve">按签收月份统计，排除时间缺失或先后无效的记录；单位为小时，保留两位小数。</text>
<rect x="40" y="360" width="530" height="196" rx="20" fill="#FFFFFF" stroke="#DFE7EF"/>
<text x="66" y="406.7" fill="#18344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" xml:space="preserve">工具环境</text>
<text x="66" y="451.7" fill="#315ED0" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" xml:space="preserve">logistics.sqlite</text>
<text x="66" y="490.0" fill="#526A7D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" xml:space="preserve">业务数据库  ·  只读访问</text>
<text x="66" y="528.1" fill="#526A7D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">schema_dictionary.md  ·  数据字典</text>
<rect x="596" y="360" width="804" height="196" rx="20" fill="#E9F2FF"/>
<text x="625" y="402.9" fill="#325D91" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">工具返回</text>
<text x="625" y="484.2" fill="#205FD1" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="68" font-weight="700" xml:space="preserve">4.25</text>
<text x="810" y="487.4" fill="#325D91" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" xml:space="preserve">小时</text>
<text x="1005" y="450.0" fill="#325D91" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" xml:space="preserve">avg_delivery_hours</text>
<text x="1005" y="487.2" fill="#526A7D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">指标值与统计口径可核验</text>
<path d="M222 616 L503 616" stroke="#B8C9D9" stroke-width="3"/>
<path d="M577 616 L858 616" stroke="#B8C9D9" stroke-width="3"/>
<path d="M932 616 L1213 616" stroke="#B8C9D9" stroke-width="3"/>
<circle cx="185" cy="616" r="29" fill="#245CD0"/>
<text x="171" y="621.9" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">01</text>
<text x="119.0" y="681.8" fill="#18344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" xml:space="preserve">读取数据字典</text>
<text x="108.5" y="712.3" fill="#60788B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" xml:space="preserve">确认字段与业务口径</text>
<circle cx="540" cy="616" r="29" fill="#245CD0"/>
<text x="526" y="621.9" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">02</text>
<text x="474.0" y="681.8" fill="#18344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" xml:space="preserve">执行只读查询</text>
<text x="472.0" y="712.3" fill="#60788B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" xml:space="preserve">按题意筛选并计算</text>
<circle cx="895" cy="616" r="29" fill="#245CD0"/>
<text x="881" y="621.9" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">03</text>
<text x="829.0" y="681.8" fill="#18344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" xml:space="preserve">核验工具返回</text>
<text x="835.5" y="712.3" fill="#60788B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" xml:space="preserve">检查数值及单位</text>
<circle cx="1250" cy="616" r="29" fill="#116B67"/>
<text x="1236" y="621.9" fill="#FFFFFF" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">04</text>
<text x="1184.0" y="681.8" fill="#18344C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" xml:space="preserve">形成最终回答</text>
<text x="1173.5" y="712.3" fill="#60788B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="400" xml:space="preserve">给出结论与统计口径</text>
<rect x="40" y="742" width="1360" height="276" rx="20" fill="#152F45"/>
<text x="66" y="782.0" fill="#A8C9DD" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" xml:space="preserve">查询关键逻辑（节选）</text>
<text x="66" y="825.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">SELECT ROUND(AVG((julianday(delivered_at) -</text>
<text x="66" y="851.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">    julianday(out_for_delivery_at)) * 24), 2)</text>
<text x="66" y="877.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">FROM delivery_records</text>
<text x="66" y="903.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">WHERE region = '华东' AND status = '已签收'</text>
<text x="66" y="929.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at &gt;= '2026-09-01'</text>
<text x="66" y="955.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at &lt;  '2026-10-01'</text>
<text x="66" y="981.2" fill="#DAE9F4" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">  AND delivered_at &gt;= out_for_delivery_at;</text>
<rect x="40" y="1044" width="1360" height="156" rx="20" fill="#E5F5EF"/>
<text x="66" y="1086.9" fill="#12695E" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" xml:space="preserve">最终回答</text>
<text x="66" y="1132.4" fill="#164D46" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" xml:space="preserve">华东区域在2026年9月的平均派送时长为4.25小时。</text>
<text x="66" y="1174.1" fill="#387C6E" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="400" xml:space="preserve">演示判分：结果一致  ·  筛选口径完整  ·  只读工具证据  ·  回答已收尾</text>
<text x="48" y="1247.2" fill="#6B8193" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" xml:space="preserve">示例中的数据与字段均为合成内容；图中结果不计入模型效果对照。</text>
</svg>
