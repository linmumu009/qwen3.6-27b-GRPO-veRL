{
  "launcher": "python",
  "module": "verl.trainer.main_ppo",
  "overrides": [
    "model_engine=megatron",
    "algorithm.adv_estimator=grpo",
    "algorithm.use_kl_in_reward=false",
    "data.train_files={ROOT}/datasets/{KIND}/train.parquet",
    "data.val_files={ROOT}/datasets/{KIND}/val.parquet",
    "data.train_batch_size=4",
    "data.max_prompt_length=1024",
    "data.max_response_length=1024",
    "data.filter_overlong_prompts=false",
    "data.filter_overlong_prompts_workers=1",
    "data.dataloader_num_workers=0",
    "data.return_raw_chat=true",
    "data.return_multi_modal_inputs=false",
    "data.truncation=error",
    "+data.apply_chat_template_kwargs.enable_thinking=false",
    "actor_rollout_ref.model.path={MODEL}",
    "actor_rollout_ref.model.use_remove_padding=false",
    "actor_rollout_ref.model.enable_gradient_checkpointing=true",
    "actor_rollout_ref.model.mtp.enable=false",
    "actor_rollout_ref.actor.optim.lr=1e-6",
    "actor_rollout_ref.actor.ppo_mini_batch_size=4",
    "actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1",
    "actor_rollout_ref.actor.use_dynamic_bsz=false",
    "actor_rollout_ref.actor.use_kl_loss=false",
    "actor_rollout_ref.actor.entropy_coeff=0",
    "actor_rollout_ref.actor.megatron.tensor_model_parallel_size=4",
    "actor_rollout_ref.actor.megatron.pipeline_model_parallel_size=2",
    "actor_rollout_ref.actor.megatron.context_parallel_size=2",
    "actor_rollout_ref.actor.megatron.use_mbridge=true",
    "actor_rollout_ref.actor.megatron.vanilla_mbridge=false",
    "actor_rollout_ref.actor.megatron.use_remove_padding=false",
    "actor_rollout_ref.actor.megatron.param_offload=true",
    "actor_rollout_ref.actor.megatron.optimizer_offload=true",
    "actor_rollout_ref.actor.megatron.grad_offload=true",
    "actor_rollout_ref.actor.megatron.use_dist_checkpointing=true",
    "++actor_rollout_ref.actor.megatron.override_transformer_config.attention_backend=auto",
    "++actor_rollout_ref.actor.megatron.override_transformer_config.context_parallel_algo=kvallgather_cp_algo",
    "++actor_rollout_ref.actor.megatron.override_transformer_config.recompute_method=uniform",
    "++actor_rollout_ref.actor.megatron.override_transformer_config.recompute_granularity=full",
    "++actor_rollout_ref.actor.megatron.override_transformer_config.recompute_num_layers=1",
    "++actor_rollout_ref.actor.megatron.override_transformer_config.use_flash_attn=true",
    "actor_rollout_ref.actor.checkpoint.save_contents=[model,extra]",
    "actor_rollout_ref.rollout.name=vllm",
    "actor_rollout_ref.rollout.mode=async",
    "actor_rollout_ref.rollout.tensor_model_parallel_size=4",
    "actor_rollout_ref.rollout.gpu_memory_utilization=0.5",
    "actor_rollout_ref.rollout.max_model_len=2048",
    "actor_rollout_ref.rollout.max_num_batched_tokens=4096",
    "actor_rollout_ref.rollout.max_num_seqs=8",
    "actor_rollout_ref.rollout.n=4",
    "actor_rollout_ref.rollout.enforce_eager=true",
    "actor_rollout_ref.rollout.free_cache_engine=true",
    "actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1",
    "actor_rollout_ref.rollout.checkpoint_engine.update_weights_bucket_megabytes=4096",
    "actor_rollout_ref.rollout.agent.num_workers=2",
    "reward.custom_reward_function.path={ROOT}/tools/reward.py",
    "reward.custom_reward_function.name=compute_score",
    "reward.reward_manager.name=naive",
    "trainer.default_local_dir={OUT}/checkpoints",
    "trainer.project_name=business-delivery",
    "trainer.experiment_name={KIND}",
    "trainer.logger=[console]",
    "trainer.total_epochs=1",
    "trainer.total_training_steps=1",
    "trainer.save_freq=1",
    "trainer.test_freq=-1",
    "trainer.val_before_train=false",
    "trainer.resume_mode=disable",
    "trainer.max_actor_ckpt_to_keep=1",
    "trainer.nnodes=1",
    "trainer.n_gpus_per_node=16",
    "trainer.device=npu",
    "+ray_kwargs.ray_init.num_cpus=96",
    "actor_rollout_ref.rollout.multi_turn.enable=true",
    "actor_rollout_ref.rollout.multi_turn.tool_config_path={ROOT}/tools/calculator.yaml",
    "actor_rollout_ref.rollout.multi_turn.format=qwen3_coder",
    "actor_rollout_ref.rollout.multi_turn.max_assistant_turns=3",
    "actor_rollout_ref.rollout.multi_turn.max_user_turns=2",
    "actor_rollout_ref.rollout.multi_turn.max_parallel_calls=1",
    "actor_rollout_ref.rollout.multi_turn.max_tool_response_length=128"
  ]
}
