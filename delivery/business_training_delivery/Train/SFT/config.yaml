{
  "launcher": "torchrun",
  "module": "verl.trainer.sft_trainer",
  "overrides": [
    "data.train_files={ROOT}/datasets/{KIND}/train.parquet",
    "data.val_files={ROOT}/datasets/{KIND}/val.parquet",
    "data.train_batch_size=4",
    "data.micro_batch_size_per_gpu=1",
    "data.use_dynamic_bsz=false",
    "data.max_token_len_per_gpu=1024",
    "data.max_length=1024",
    "data.pad_mode=no_padding",
    "data.truncation=error",
    "data.num_workers=0",
    "model=hf_model",
    "model.path={MODEL}",
    "model.trust_remote_code=true",
    "model.use_remove_padding=false",
    "model.lora_rank=0",
    "model.mtp.enable=false",
    "model.mtp.enable_train=false",
    "model.mtp.enable_rollout=false",
    "optim=megatron",
    "optim.lr=1e-6",
    "optim.min_lr=1e-6",
    "optim.lr_warmup_steps_ratio=0",
    "optim.weight_decay=0",
    "optim.betas=[0.9,0.95]",
    "optim.clip_grad=1.0",
    "optim.lr_decay_style=constant",
    "+optim.override_optimizer_config.optimizer_cpu_offload=false",
    "engine=megatron",
    "engine.tensor_model_parallel_size=4",
    "engine.pipeline_model_parallel_size=2",
    "engine.context_parallel_size=2",
    "engine.use_mbridge=true",
    "engine.vanilla_mbridge=false",
    "engine.use_megatron_fsdp=false",
    "engine.use_remove_padding=false",
    "engine.param_offload=false",
    "engine.optimizer_offload=false",
    "engine.grad_offload=true",
    "engine.dtype=bfloat16",
    "engine.use_distributed_optimizer=true",
    "engine.use_dist_checkpointing=true",
    "engine.dist_checkpointing_path=null",
    "++engine.override_transformer_config.attention_backend=auto",
    "++engine.override_transformer_config.context_parallel_algo=kvallgather_cp_algo",
    "++engine.override_transformer_config.recompute_method=uniform",
    "++engine.override_transformer_config.recompute_granularity=full",
    "++engine.override_transformer_config.recompute_num_layers=1",
    "++engine.override_transformer_config.use_flash_attn=true",
    "++engine.override_transformer_config.sequence_parallel=true",
    "checkpoint.load_contents=[]",
    "checkpoint.save_contents=[model,extra]",
    "trainer.default_local_dir={OUT}/checkpoints",
    "trainer.project_name=business-delivery",
    "trainer.experiment_name={KIND}",
    "trainer.logger=[console]",
    "trainer.total_epochs=1",
    "trainer.total_training_steps=1",
    "trainer.save_freq=1",
    "trainer.test_freq=1",
    "trainer.resume_mode=disable",
    "trainer.max_ckpt_to_keep=1",
    "trainer.nnodes=1",
    "trainer.n_gpus_per_node=16",
    "trainer.device=npu",
    "data.enable_thinking_default=false",
    "data.custom_cls.path={ROOT}/tools/loaders/qwen36_assistant_mask_sft_dataset.py",
    "data.custom_cls.name=Qwen36AssistantMaskSFTDataset"
  ]
}
