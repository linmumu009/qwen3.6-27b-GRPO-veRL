tools:
  - class_name: "llin_verl.pi_workspace_tools.PiWorkspaceTool"
    config: &pi_tool_config
      type: "native"
      operation: "bash"
      sandbox_root: "/pi_sandbox"
      run_root: "/workspace/grpo_run/pi_workspaces"
      max_tool_timeout: 900
      max_tool_output: 51200
      max_tool_lines: 2000
    tool_schema:
      type: function
      function:
        name: bash
        description: "Execute a bash command in the current working directory. Returns stdout and stderr. Output is truncated to last 2000 lines or 50KB (whichever is hit first). If truncated, full output is saved to a temp file. Optionally provide a timeout in seconds."
        parameters:
          type: object
          properties:
            command: {type: string, description: "Bash command to execute"}
            timeout: {type: number, description: "Timeout in seconds (optional, no default timeout)"}
          required: [command]
  - class_name: "llin_verl.pi_workspace_tools.PiWorkspaceTool"
    config:
      <<: *pi_tool_config
      operation: "read"
    tool_schema:
      type: function
      function:
        name: read
        description: "Read the contents of a file. Supports text files and images (jpg, png, gif, webp). Images are sent as attachments. For text files, output is truncated to 2000 lines or 50KB (whichever is hit first). Use offset/limit for large files. When you need the full file, continue with offset until complete."
        parameters:
          type: object
          properties:
            path: {type: string, description: "Path to the file to read (relative or absolute)"}
            offset: {type: number, description: "Line number to start reading from (1-indexed)"}
            limit: {type: number, description: "Maximum number of lines to read"}
          required: [path]
  - class_name: "llin_verl.pi_workspace_tools.PiWorkspaceTool"
    config:
      <<: *pi_tool_config
      operation: "edit"
    tool_schema:
      type: function
      function:
        name: edit
        description: "Edit a single file using exact text replacement. Every edits[].oldText must match a unique, non-overlapping region of the original file. If two changes affect the same block or nearby lines, merge them into one edit instead of emitting overlapping edits. Do not include large unchanged regions just to connect distant changes."
        parameters:
          type: object
          properties:
            path: {type: string, description: "Path to the file to edit (relative or absolute)"}
            edits:
              type: array
              description: "One or more targeted replacements. Each edit is matched against the original file, not incrementally. Do not include overlapping or nested edits. If two changes touch the same block or nearby lines, merge them into one edit instead."
              items:
                type: object
                properties:
                  oldText: {type: string, description: "Exact text for one targeted replacement. It must be unique in the original file and must not overlap with any other edits[].oldText in the same call."}
                  newText: {type: string, description: "Replacement text for this targeted edit."}
                required: [oldText, newText]
                additionalProperties: false
          required: [path, edits]
          additionalProperties: false
  - class_name: "llin_verl.pi_workspace_tools.PiWorkspaceTool"
    config:
      <<: *pi_tool_config
      operation: "write"
    tool_schema:
      type: function
      function:
        name: write
        description: "Write content to a file. Creates the file if it doesn't exist, overwrites if it does. Automatically creates parent directories."
        parameters:
          type: object
          properties:
            path: {type: string, description: "Path to the file to write (relative or absolute)"}
            content: {type: string, description: "Content to write to the file"}
          required: [path, content]
